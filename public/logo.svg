<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#165dff"/>
      <stop offset="100%" stop-color="#722ed1"/>
    </linearGradient>
    <radialGradient id="shine" cx="28%" cy="20%" r="55%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.16)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- 渐变背景 -->
  <rect width="200" height="200" rx="44" fill="url(#grad)"/>
  <rect width="200" height="200" rx="44" fill="url(#shine)"/>

  <!--
    T 字母：
    横杠 x=30~170, y=44~70（高 26px）
    竖杠 x=87~113, y=70~158（宽 26px）
    外角圆滑，内侧直角，整体居中
  -->
  <path d="
    M 40,44
    L 160,44 Q 170,44 170,54
    L 170,70
    L 113,70
    L 113,148 Q 113,158 103,158
    L  97,158 Q  87,158  87,148
    L  87,70
    L  30,70
    L  30,54 Q  30,44  40,44
    Z
  " fill="white" opacity="0.97"/>
</svg>
