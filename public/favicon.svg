<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="200" fill="#f5f6fa"/>
  
  <!-- 主体圆形 -->
  <circle cx="100" cy="100" r="85" fill="url(#gradient)" filter="url(#shadow)"/>
  
  <!-- 内部设计 - 现代化的"B"字母 -->
  <g transform="translate(100, 100)">
    <!-- 竖线 -->
    <rect x="-15" y="-35" width="12" height="70" rx="6" fill="white" opacity="0.95"/>
    
    <!-- 上半部分圆弧 -->
    <path d="M -3 -35 Q 25 -35 25 -10 Q 25 10 -3 10" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
    
    <!-- 下半部分圆弧 -->
    <path d="M -3 10 Q 28 10 28 30 Q 28 35 -3 35" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.95"/>
  </g>
</svg>
